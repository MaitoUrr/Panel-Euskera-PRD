<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Euskera · Panel de Control</title>
<style>
  :root{
    --malt-900:#17130F;
    --malt-800:#221B14;
    --malt-700:#2C231A;
    --copper-500:#C17D3E;
    --copper-300:#E3A968;
    --basque-green:#3F6B4C;
    --basque-green-dim:#2B4A35;
    --foam-100:#F3ECDD;
    --foam-dim:rgba(243,236,221,0.56);
    --foam-faint:rgba(243,236,221,0.14);
    --rust-600:#A8462F;
    --rust-dim:rgba(168,70,47,0.18);
  }
  *{box-sizing:border-box;}
  body,html{margin:0;padding:0;}
  .euskera-app{
    background:var(--malt-900);
    color:var(--foam-100);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh;
    display:flex;
    font-size:14px;
  }
  .stencil{
    font-family:"Arial Narrow","Helvetica Neue Condensed","Roboto Condensed",sans-serif;
    text-transform:uppercase;
    letter-spacing:0.09em;
    font-weight:800;
  }
  .mono{font-family:"SF Mono","Consolas","Menlo",monospace;}

  .sidebar{
    width:220px;flex-shrink:0;background:var(--malt-900);
    border-right:1px solid var(--foam-faint);padding:20px 14px;
    display:flex;flex-direction:column;gap:16px;overflow-y:auto;
  }
  .brand{padding:0 6px;display:flex;align-items:center;gap:10px;}
  .brand img{width:58px;height:58px;object-fit:contain;}
  .brand .name{font-size:18px;color:var(--foam-100);line-height:1.1;}
  .brand .sub{font-size:9.5px;color:var(--copper-300);letter-spacing:0.16em;margin-top:2px;}
  .nav-group{display:flex;flex-direction:column;gap:2px;}
  .nav-group-label{font-size:11.5px;letter-spacing:0.1em;color:var(--copper-300);text-transform:uppercase;padding:0 10px;margin:10px 0 4px;font-weight:800;}
  .nav-group-label.first{margin-top:0;}
  .nav button{
    all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;
    padding:8px 10px;border-radius:6px;color:var(--foam-dim);font-size:12.5px;font-weight:600;letter-spacing:0.02em;width:100%;
  }
  .nav button:hover{background:var(--malt-700);color:var(--foam-100);}
  .nav button.active{background:var(--malt-700);color:var(--copper-300);}
  .nav button:focus-visible{outline:2px solid var(--copper-300);outline-offset:2px;}
  .nav .ico{width:16px;text-align:center;}
  .sidebar-foot{margin-top:auto;font-size:10.5px;color:var(--foam-dim);padding:0 6px;line-height:1.5;}

  .main{flex:1;min-width:0;padding:26px 34px 50px;}
  .topbar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px;flex-wrap:wrap;gap:8px;}
  .topbar h1{font-size:22px;margin:0;color:var(--foam-100);}
  .topbar .date{color:var(--foam-dim);font-size:12px;}

  .grid{display:grid;gap:14px;}
  .kpis{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:22px;}
  .kpi{width:330px;flex:none;padding:20px 22px;}
  .kpi .label{font-size:14px;letter-spacing:0.06em;color:var(--foam-dim);text-transform:uppercase;white-space:nowrap;}
  .kpi .value{font-size:39px;margin-top:6px;color:var(--foam-100);font-weight:800;}
  .dash-cols{display:grid;grid-template-columns:minmax(0,700px) 1fr;gap:36px;align-items:start;}
  .prod-cards{display:grid;grid-template-columns:repeat(2,minmax(230px,1fr));gap:12px;}
  .prod-card{background:var(--malt-800);border:1px solid var(--foam-faint);border-radius:10px;padding:14px 16px;}
  .prod-card .nombre{font-size:14px;color:var(--foam-dim);text-transform:uppercase;letter-spacing:0.03em;margin-bottom:6px;}
  .prod-card .cantidad{font-size:24px;font-weight:800;color:var(--copper-300);}
  .prod-card .sub{font-size:13.75px;color:var(--foam-dim);margin-top:8px;line-height:1.6;}
  .prod-card .sub strong{color:var(--copper-300);font-weight:800;}
  .dash-left{display:flex;gap:20px;align-items:stretch;}
  .segment-cards{display:flex;flex-direction:column;gap:12px;padding-left:20px;border-left:1px solid var(--foam-faint);min-width:210px;}
  .segment-card{border-radius:10px;padding:14px 16px;border:1px solid transparent;}
  .segment-card .nombre{font-size:14px;color:var(--foam-dim);text-transform:uppercase;letter-spacing:0.03em;margin-bottom:6px;}
  .segment-card .cantidad{font-size:22px;font-weight:800;}
  .segment-card .sub{font-size:12.5px;color:var(--foam-dim);margin-top:6px;}
  .segment-card.granel{background:rgba(63,107,78,0.22);border-color:rgba(159,216,174,0.25);}
  .segment-card.granel .cantidad{color:#9FD8AE;}
  .segment-card.recarga{background:rgba(193,125,62,0.16);border-color:rgba(227,169,104,0.3);}
  .segment-card.recarga .cantidad{color:var(--copper-300);}
  @media (max-width:900px){
    .dash-left{flex-direction:column;}
    .segment-cards{border-left:none;border-top:1px solid var(--foam-faint);padding-left:0;padding-top:16px;}
    .dash-cols{grid-template-columns:1fr;}
    .prod-cards{grid-template-columns:1fr;}
  }
  .card{background:var(--malt-800);border:1px solid var(--foam-faint);border-radius:10px;padding:16px 18px;}
  .kpi .value.copper{color:var(--copper-300);}
  .kpis-sm{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px;}
  .kpi-sm{width:175px;flex:none;padding:14px 16px;}
  .kpi-sm .label{font-size:10.5px;letter-spacing:0.05em;color:var(--foam-dim);text-transform:uppercase;white-space:nowrap;}
  .kpi-sm .value{font-size:19px;margin-top:4px;font-weight:800;}
  .kpi-sm .value.green{color:#7FB88F;}
  .kpi-sm .value.copper{color:var(--copper-300);}
  .kpi .value.rust{color:var(--rust-600);}
  .kpi .value.green{color:#7FB88F;}

  .section-title{font-size:12px;letter-spacing:0.1em;color:var(--foam-dim);text-transform:uppercase;margin:26px 0 10px;}
  .section-title.first{margin-top:0;}

  table{width:100%;border-collapse:collapse;font-size:14.5px;color:var(--foam-100);}
  th{
    text-align:left;font-size:11.5px;letter-spacing:0.06em;text-transform:uppercase;
    color:var(--foam-dim);padding:9px 10px;border-bottom:1px solid var(--foam-faint);font-weight:700;
  }
  td{padding:11px 10px;border-bottom:1px solid var(--foam-faint);vertical-align:middle;color:var(--foam-100);}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:rgba(255,255,255,0.02);}
  tr.clickable{cursor:pointer;}
  tr.expand-row td{background:rgba(255,255,255,0.03);padding:12px 16px;}

  .btn{
    all:unset;cursor:pointer;background:var(--copper-500);color:var(--malt-900);
    padding:8px 14px;border-radius:6px;font-weight:700;font-size:12.5px;letter-spacing:0.02em;
  }
  .btn:hover{background:var(--copper-300);}
  .btn:focus-visible{outline:2px solid var(--foam-100);outline-offset:2px;}
  .btn.ghost{background:transparent;border:1px solid var(--foam-faint);color:var(--foam-100);}
  .btn.ghost:hover{border-color:var(--copper-300);color:var(--copper-300);}
  .btn.small{padding:5px 10px;font-size:11px;}
  .btn.danger{background:var(--rust-600);color:var(--foam-100);}

  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}

  .keg{display:inline-block;width:14px;height:18px;border-radius:4px 4px 3px 3px;position:relative;vertical-align:middle;}
  .keg::before{content:"";position:absolute;top:2px;left:0;right:0;height:2px;background:rgba(0,0,0,0.25);}
  .keg.planta{background:var(--basque-green);}
  .keg.entregado{background:var(--copper-500);}
  .keg.atrasado{background:var(--rust-600);}

  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:20px;}
  .pill.planta{background:var(--basque-green-dim);color:#9FD8AE;}
  .pill.entregado{background:rgba(193,125,62,0.18);color:var(--copper-300);}
  .pill.atrasado{background:var(--rust-dim);color:#E0876F;}

  input,select{
    background:var(--malt-900);border:1px solid var(--foam-faint);color:var(--foam-100);
    padding:9px 10px;border-radius:6px;font-size:13px;width:100%;font-family:inherit;
  }
  input:focus,select:focus{outline:2px solid var(--copper-300);outline-offset:1px;border-color:transparent;}
  label{font-size:11px;color:var(--foam-dim);letter-spacing:0.04em;text-transform:uppercase;display:block;margin-bottom:5px;}
  .field{margin-bottom:14px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  .empty{color:var(--foam-dim);font-size:13px;padding:24px 4px;text-align:center;border:1px dashed var(--foam-faint);border-radius:8px;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(10,8,6,0.7);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;overflow-y:auto;}
  .modal{background:var(--malt-800);border:1px solid var(--foam-faint);border-radius:12px;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;padding:22px 24px;}
  .modal.wide{max-width:920px;}
  .modal h2{font-size:16px;margin:0 0 16px;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--copper-300);color:var(--malt-900);font-weight:700;font-size:12.5px;
    padding:10px 18px;border-radius:8px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,0.4);
  }

  .modal th{white-space:nowrap;}
  .modal td{white-space:nowrap;}
  td.num{text-align:right;}
  .qr-print{text-align:center;padding:14px;background:#fff;border-radius:8px;color:#111;}
  .qr-print .lbl{font-family:"Arial Narrow",sans-serif;font-weight:800;letter-spacing:0.08em;margin-top:8px;font-size:16px;}

  .informes-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:stretch;}
  .informes-col-left{display:flex;flex-direction:column;gap:12px;}
  .chart-card{padding:12px 14px 8px;display:flex;flex-direction:column;}
  .chart-card canvas{max-height:190px;}
  .chart-card-tall{display:flex;flex-direction:column;}
  .chart-card-tall canvas{max-height:600px;flex:1;}
  .chart-label{font-size:11.5px;color:var(--foam-dim);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:6px;}
  @media (max-width:900px){
    .informes-grid{grid-template-columns:1fr;}
  }
  .item-row{display:grid;grid-template-columns:1fr 90px 110px 110px 32px;gap:8px;align-items:end;margin-bottom:8px;}
  .item-row .field{margin-bottom:0;}
  .item-row .subtotal-box{background:var(--malt-900);border:1px solid var(--foam-faint);border-radius:6px;padding:9px 10px;font-size:13px;color:var(--copper-300);font-weight:700;text-align:right;white-space:nowrap;overflow:hidden;}
  .item-row .remove-btn{all:unset;cursor:pointer;color:var(--rust-600);font-size:18px;text-align:center;padding:8px 0;}
  .item-row-headers{display:grid;grid-template-columns:1fr 90px 110px 110px 32px;gap:8px;margin-bottom:4px;}
  .item-row-headers span{font-size:10px;color:var(--foam-dim);text-transform:uppercase;letter-spacing:0.05em;}
  .remito-total{font-size:18px;font-weight:800;text-align:right;margin:14px 0;color:var(--copper-300);}

  .menu-toggle{display:none;}
  @media (max-width:760px){
    .menu-toggle{
      display:flex;align-items:center;justify-content:center;
      position:fixed;top:14px;left:14px;z-index:50;
      width:38px;height:38px;border-radius:8px;
      background:var(--malt-800);border:1px solid var(--foam-faint);color:var(--foam-100);
      font-size:18px;cursor:pointer;
    }
    .euskera-app{flex-direction:column;}
    .sidebar{display:none;}
    .sidebar.open{
      display:flex;flex-direction:column;position:fixed;inset:0;z-index:45;
      width:100%;height:100%;overflow-y:auto;padding:64px 16px 20px;
    }
    .sidebar-foot{display:block;}
    .main{padding:64px 18px 18px;}
    .field-row{grid-template-columns:1fr;}
    .item-row, .item-row-headers{grid-template-columns:1fr;}
    .item-row .remove-btn{justify-self:end;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
  @media print{
    body *{visibility:hidden;}
    .qr-print, .qr-print *{visibility:visible;}
    .qr-print{position:fixed;top:40px;left:50%;transform:translateX(-50%);}
  }
</style>
</head>
<body>

<div class="euskera-app" id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<script>
(function(){
  const API_URL = "api.php";

  let state = { clientes:[], proveedores:[], insumos:[], productos:[], barriles:[], remitos:[], compras:[], mediosPago:[], tiposInsumo:[], ccPagos:[], recetas:[], lotesProduccion:[], categoriasGasto:[], gastos:[] };
  let ui = { tab:"dashboard", modal:null, loaded:false, auth:null, loginError:"", expandedBarril:null, confirmData:null, remitoDraft:null, remitoGenerado:null, compraDraft:null, editCompraDraft:null,
    informesRango:6, informes:{clienteId:"", barrilId:"", prodId:"", fechaDesde:"", fechaHasta:""}, alertaStockData:null, kardexData:null, loteDraft:null, recetaDraft:null, ajustesData:null, sidebarOpen:false, ajusteManualDraft:null };
  let charts = {};

  const todayISO = () => new Date().toISOString().slice(0,10);
  const fmtMoney = (n) => "$" + Number(n||0).toLocaleString("es-AR");
  const fmtDate = (d) => d ? new Date(d+"T00:00:00").toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"}) : "—";
  const daysSince = (d) => !d ? 0 : Math.floor((Date.now()-new Date(d+"T00:00:00").getTime())/86400000);
  const barrilEstado = (b) => b.estado==="planta" ? "planta" : (daysSince(b.fechaEntrega)>21 ? "atrasado" : "entregado");
  const isThisMonth = (fecha) => fecha && fecha.slice(0,7) === todayISO().slice(0,7);
  const cap = (s) => s ? s.charAt(0).toUpperCase()+s.slice(1) : s;
  const fmtQty = (n) => Number(n||0).toLocaleString("es-AR", {minimumFractionDigits:3, maximumFractionDigits:3});
  const fmtMoney3 = (n) => "$" + Number(n||0).toLocaleString("es-AR", {minimumFractionDigits:3, maximumFractionDigits:3});
  const mediosPagoOpts = (selected) => state.mediosPago.map(m=>`<option ${selected===m.nombre?'selected':''}>${m.nombre}</option>`).join("");

  async function api(action, payload){
    const res = await fetch(API_URL, {
      method:"POST", headers:{"Content-Type":"application/json"}, credentials:"same-origin",
      body: JSON.stringify(Object.assign({action}, payload||{}))
    });
    if(!res.ok) throw new Error("Error de red: "+res.status);
    return res.json();
  }

  function showToast(msg){
    const t = document.createElement("div"); t.className="toast"; t.textContent=msg;
    document.body.appendChild(t); setTimeout(()=>t.remove(), 2400);
  }

  async function refreshState(){
    try{
      const r = await api("get_data");
      if(r.ok){ state = Object.assign({clientes:[],proveedores:[],insumos:[],productos:[],barriles:[],remitos:[],compras:[],mediosPago:[],tiposInsumo:[],ccPagos:[],recetas:[],lotesProduccion:[],categoriasGasto:[],gastos:[]}, r.data); }
      else { showToast(r.error || "No se pudieron cargar los datos"); }
    }catch(e){ console.error(e); showToast("No se pudo conectar con el servidor."); }
  }

  async function checkSession(){
    try{ const r = await api("check_session"); if(r.ok && r.auth) ui.auth = r.auth; }
    catch(e){ console.error(e); }
  }

  async function loadData(){
    await checkSession();
    if(ui.auth) await refreshState();
    ui.loaded = true; render();
    if(ui.auth) checkAlertaStock();
  }

  function checkAlertaStock(){
    const insumosBajos = state.insumos.filter(i=>Number(i.stockSeguridad)>0 && Number(i.stock) < Number(i.stockSeguridad));
    const productosBajos = state.productos.filter(p=>Number(p.stockSeguridad)>0 && Number(p.stock) < Number(p.stockSeguridad));
    if(insumosBajos.length===0 && productosBajos.length===0) return;
    ui.alertaStockData = {insumosBajos, productosBajos};
    openModal('alertaStock');
  }
  function buildAlertaStockTexto(){
    const d = ui.alertaStockData;
    let txt = `⚠️ Alerta de stock bajo — Euskera (${new Date().toLocaleDateString('es-AR')})\n\n`;
    if(d.insumosBajos.length){
      txt += `Insumos:\n`;
      d.insumosBajos.forEach(i=>{ txt += `• ${i.nombre}: ${i.stock} ${i.unidad} (seguridad: ${i.stockSeguridad} ${i.unidad})\n`; });
      txt += `\n`;
    }
    if(d.productosBajos.length){
      txt += `Productos:\n`;
      d.productosBajos.forEach(p=>{ txt += `• ${p.nombre}: ${p.stock}\n`; });
    }
    return txt;
  }

  let isBusy = false;
  async function run(action, payload, okMsg){
    if(isBusy) return null; // evita que un doble click (o toque repetido) genere registros duplicados
    isBusy = true;
    try{
      const r = await api(action, payload);
      if(!r.ok){ showToast(r.error || "Ocurrió un error."); return null; }
      await refreshState();
      if(okMsg) showToast(okMsg);
      return r;
    }catch(e){ console.error(e); showToast("No se pudo conectar con el servidor."); return null; }
    finally{ isBusy = false; }
  }

  // ---------- auth ----------
  async function intentarLogin(){
    const u = document.getElementById("f-user").value.trim().toLowerCase();
    const p = document.getElementById("f-pass").value;
    if(!u || !p){ ui.loginError="Completá usuario y contraseña."; render(); return; }
    try{
      const r = await api("login", {usuario:u, pass:p});
      if(r.ok){ ui.auth=r.auth; ui.loginError=""; ui.loaded=false; render(); await loadData(); }
      else{ ui.loginError = r.error || "Usuario o contraseña incorrectos."; render(); }
    }catch(e){ ui.loginError="No se pudo conectar con el servidor."; render(); }
  }
  async function logout(){
    try{ await api("logout"); }catch(e){}
    ui.auth=null; ui.tab="dashboard"; ui.modal=null; render();
  }

  function setTab(tab){ ui.tab=tab; ui.modal=null; ui.expandedBarril=null; ui.sidebarOpen=false; if(tab==='ajustes') ui.ajustesData=null; render(); }
  function toggleSidebar(){ ui.sidebarOpen = !ui.sidebarOpen; render(); }
  function openModal(name, payload){ ui.modal={name, payload}; render(); }
  function closeModal(){ ui.modal=null; render(); }
  function toggleBarrilExpand(id){ ui.expandedBarril = ui.expandedBarril===id ? null : id; render(); }

  // ---------- confirmación genérica para borrar ----------
  function confirmarEliminar(tipo, id, label){
    ui.confirmData = {tipo, id};
    openModal('confirmarEliminar', label);
  }
  async function ejecutarEliminar(){
    const {tipo, id} = ui.confirmData || {};
    closeModal();
    if(tipo==='barril') await run("eliminar_barril", {id}, "Barril eliminado");
    if(tipo==='remito') await run("eliminar_remito", {id}, "Remito eliminado");
    if(tipo==='loteProduccion') await run("eliminar_lote_produccion", {id}, "Lote eliminado");
    if(tipo==='receta') await run("eliminar_receta", {id}, "Receta eliminada");
    if(tipo==='compra') await run("eliminar_compra", {id}, "Compra eliminada");
    if(tipo==='gasto') await run("eliminar_gasto", {id}, "Gasto eliminado");
    if(tipo==='categoriaGasto') await run("eliminar_categoria_gasto", {id}, "Categoría eliminada");
    render();
  }

  // ---------- barriles ----------
  async function submitNuevoBarril(){
    const id = document.getElementById("f-id").value.trim();
    const descripcion = document.getElementById("f-descripcion").value.trim();
    const litros = document.getElementById("f-litros").value;
    if(!id || !litros) return showToast("Completá ID y litros");
    if(await run("add_barril", {id, descripcion, litros}, "Barril agregado")){ closeModal(); render(); }
  }
  async function submitEditarBarril(id){
    const nuevoId = document.getElementById("f-id").value.trim();
    const descripcion = document.getElementById("f-descripcion").value.trim();
    const litros = document.getElementById("f-litros").value;
    if(!nuevoId || !litros) return showToast("Completá el identificador y los litros");
    if(await run("editar_barril", {id, nuevoId, descripcion, litros}, "Barril actualizado")){ closeModal(); render(); }
  }
  async function submitEntregarBarril(id){
    const clienteId = document.getElementById("f-cliente").value;
    if(!clienteId) return showToast("Elegí un cliente");
    if(await run("entregar_barril", {id, clienteId}, "Barril entregado")){ closeModal(); render(); }
  }
  async function devolverBarril(id){ if(await run("devolver_barril", {id}, "Barril devuelto a planta")) render(); }

  // ---------- productos ----------
  async function submitNuevoProducto(){
    const nombre = document.getElementById("f-nombre").value.trim();
    const codProd = document.getElementById("f-codprod").value.trim();

  async function submitNuevoRemito(){
    syncRemitoDraftFromDOM();
    const d = ui.remitoDraft;
    if(!d.clienteId) return showToast("Elegí un cliente");
    if(!d.tipoVenta) return showToast("Elegí el tipo de venta");
    if(d.tipoVenta==='granel' && d.barrilIds.length===0) return showToast("Elegí al menos un barril para la venta a granel");
    for(const it of d.items){
      if(!it.productoId) return showToast("Elegí un producto en todos los renglones");
      const prod = state.productos.find(p=>p.id==it.productoId);
      if(prod && Number(prod.stock) < Number(it.cantidad||0)){
        return showToast(`No hay stock suficiente de "${prod.nombre}" (disponible: ${fmtQty(prod.stock)}, pedido: ${it.cantidad}).`);
      }
    }
    const items = d.items.map(it=>{
      const prod = state.productos.find(p=>p.id==it.productoId);
      return { productoId: it.productoId, cantidad: it.cantidad, precioUnit: it.precioUnit, descripcion: prod ? prod.nombre : "" };
    });
    const r = await run("crear_remito", {clienteId: d.clienteId, tipoVenta: d.tipoVenta, barrilIds: d.barrilIds, fecha: d.fecha, medioPago: d.medioPago, items}, "Remito generado");

    return { id:null, productoId:"", nombre:"", litrosBase:"100", items:[{insumoId:"", cantidad:""}] };

  function syncRecetaDraftFromDOM(){
    if(!ui.recetaDraft) return;
    const p = document.getElementById("f-receta-producto");
    const n = document.getElementById("f-receta-nombre");
    const l = document.getElementById("f-receta-litrosbase");
    if(p) ui.recetaDraft.productoId = p.value;
    if(n) ui.recetaDraft.nombre = n.value;
    if(l) ui.recetaDraft.litrosBase = l.value;
    ui.recetaDraft.items.forEach((it,idx)=>{
      const i = document.getElementById("ri2-insumo-"+idx);
      const c = document.getElementById("ri2-cantidad-"+idx);
      if(i) it.insumoId = i.value;
      if(c) it.cantidad = c.value;
    });
  }
  function addRecetaItem(){ syncRecetaDraftFromDOM(); ui.recetaDraft.items.push({insumoId:"",cantidad:""}); render(); }
  function removeRecetaItem(idx){ syncRecetaDraftFromDOM(); if(ui.recetaDraft.items.length<=1) return; ui.recetaDraft.items.splice(idx,1); render(); }
  async function submitNuevaReceta(){
    syncRecetaDraftFromDOM();
    const d = ui.recetaDraft;
    if(!d.productoId) return showToast("Elegí la cerveza");
    if(!d.nombre.trim()) return showToast("Ingresá un nombre para la receta");
    if(!d.litrosBase || Number(d.litrosBase)<=0) return showToast("Ingresá los litros base");
    const items = d.items.filter(it=>it.insumoId && it.cantidad).map(it=>({insumoId:it.insumoId, cantidad:it.cantidad}));
    if(items.length===0) return showToast("Agregá al menos un insumo");
    const action = d.id ? "editar_receta" : "add_receta";
    const payload = d.id ? {id:d.id, productoId:d.productoId, nombre:d.nombre, litrosBase:d.litrosBase, items} : {productoId:d.productoId, nombre:d.nombre, litrosBase:d.litrosBase, items};
    if(await run(action, payload, d.id?"Receta actualizada":"Receta guardada")){ ui.recetaDraft=null; closeModal(); render(); }
  }

  function renderTopbar(title){

  function filasLitros(remitosMes){
    let total = 0;
    remitosMes.forEach(r=>{
      (r.items||[]).forEach(it=>{
        const prod = state.productos.find(p=>p.id==it.productoId);
        if(prod && prod.unidadMedida==='litros') total += Number(it.cantidad);
      });
    });
    return total;
  }

  function segmentado(remitosMes, tipo){
    const remitosTipo = remitosMes.filter(r=>r.tipoVenta===tipo);
    let litros = 0;
    remitosTipo.forEach(r=>{
      (r.items||[]).forEach(it=>{
        const prod = state.productos.find(p=>p.id==it.productoId);
        if(prod && prod.tipo==='granel' && prod.unidadMedida==='litros') litros += Number(it.cantidad);
      });
    });
    return {litros, cantidadRemitos: remitosTipo.length};
  }

  function renderDashboard(){
    const remitosMes = state.remitos.filter(r=>isThisMonth(r.fecha));
    const totalMes = remitosMes.reduce((s,r)=>s+Number(r.total),0);

    const porProducto = {};
    remitosMes.forEach(r=>{
      (r.items||[]).forEach(it=>{
        if(!it.productoId) return;
        if(!porProducto[it.productoId]) porProducto[it.productoId] = {nombre:it.descripcion, cantidad:0, total:0};
        porProducto[it.productoId].cantidad += Number(it.cantidad);
        porProducto[it.productoId].total += Number(it.cantidad)*Number(it.precioUnit);
      });
    });

    let html = renderTopbar("Dashboard");
    const litrosVendidos = filasLitros(remitosMes);
    const litrosStock = state.productos.filter(p=>p.tipo==='granel' && p.unidadMedida==='litros').reduce((s,p)=>s+Number(p.stock),0);
    const litrosFermentando = state.lotesProduccion.filter(l=>l.estado==='fermentando').reduce((s,l)=>s+Number(l.litrosObjetivo),0);
    const litrosMadurando = state.lotesProduccion.filter(l=>l.estado==='madurando').reduce((s,l)=>s+Number(l.litrosObjetivo),0);
    html += `<div class="kpis" style="align-items:stretch;">
      <div class="card kpi"><div class="label">Ventas del mes</div><div class="value copper">${fmtMoney(totalMes)}</div></div>
      <div class="card kpi"><div class="label">Litros vendidos este mes</div><div class="value green">${fmtQty(litrosVendidos)} Lts.</div></div>
      <div style="width:1px;background:var(--foam-faint);align-self:stretch;margin:4px 2px;"></div>
      <div class="card kpi-sm" style="align-self:flex-start;"><div class="label">Stock</div><div class="value">${fmtQty(litrosStock)} Lts.</div></div>
      <div class="card kpi-sm" style="align-self:flex-start;"><div class="label">Fermentación</div><div class="value" style="color:var(--copper-300);">${fmtQty(litrosFermentando)} Lts.</div></div>
      <div class="card kpi-sm" style="align-self:flex-start;"><div class="label">Maduración</div><div class="value" style="color:#9FD8AE;">${fmtQty(litrosMadurando)} Lts.</div></div>
    </div>`;

    html += `<div class="section-title first">Productos vendidos este mes</div>`;
    const filas = Object.keys(porProducto).map(pid=>({pid, ...porProducto[pid]}));
    {
      const esGranelProd = f => { const prod = state.productos.find(p=>p.id==f.pid); return prod && prod.tipo==='granel'; };
      let granelFilas = filas.filter(esGranelProd).sort((a,b)=>b.cantidad-a.cantidad);
      const otrasFilas = filas.filter(f=>!esGranelProd(f)).sort((a,b)=>b.total-a.total);

      // completar hasta 4 tarjetas con productos Granel del catálogo que no tuvieron ventas este mes
      const yaIncluidos = new Set(granelFilas.map(f=>String(f.pid)));
      const catalogoGranelRestante = state.productos.filter(p=>p.tipo==='granel' && !yaIncluidos.has(String(p.id)));
      let i = 0;
      while(granelFilas.length<4 && i<catalogoGranelRestante.length){
        const p = catalogoGranelRestante[i];
        granelFilas.push({pid:p.id, nombre:p.nombre, cantidad:0, total:0});
        i++;
      }

      const destacados = granelFilas.slice(0,4);
      const resto = granelFilas.slice(4).concat(otrasFilas);
      const granelData = segmentado(remitosMes,'granel');
      const recargaData = segmentado(remitosMes,'recarga');
      html += `<div class="dash-cols">`;
      html += `<div class="dash-left">`;
      html += `<div class="prod-cards">`;
      if(destacados.length===0){
        html += `<div class="empty" style="grid-column:1/-1;">Todavía no hay productos tipo Granel cargados en el catálogo.</div>`;
      }
      destacados.forEach(f=>{
        const prod = state.productos.find(p=>p.id==f.pid);
        const esLitros = prod && prod.unidadMedida==='litros';
        const cantidadTxt = (esLitros ? fmtQty(f.cantidad) : f.cantidad) + (esLitros ? ' Lts.' : '');
        const stockTxt = (esLitros ? fmtQty(prod?prod.stock:0) : (prod?prod.stock:"—")) + (esLitros ? ' Lts.' : '');

        const loteActivo = state.lotesProduccion.filter(l=>l.estado!=='terminado' && String(l.productoId)===String(f.pid)).sort((a,b)=>b.id-a.id)[0];
        const ultimaProd = state.lotesProduccion.filter(l=>l.estado==='terminado' && String(l.productoId)===String(f.pid)).sort((a,b)=>b.id-a.id)[0];
        let prodLineas;
        if(loteActivo){
          prodLineas = `Última Producción: ${fmtDate(loteActivo.fechaCoccion)}<br>Estado: ${estadoLoteLabel[loteActivo.estado]}`;
        } else if(ultimaProd){
          prodLineas = `Última producción: ${fmtQty(ultimaProd.litrosReales)} Lts. — ${fmtDate(ultimaProd.fechaTerminado)}`;
        } else {
          prodLineas = `Última producción: sin datos todavía`;
        }

        html += `<div class="prod-card">
          <div class="nombre">${f.nombre}</div>
          <div class="cantidad">${cantidadTxt}</div>
          <div class="sub">Stock remanente: <strong>${stockTxt}</strong><br>${prodLineas}</div>
        </div>`;
      });
      html += `</div>`;
      html += `<div class="segment-cards">
        <div class="segment-card granel">
          <div class="nombre">Granel</div>
          <div class="cantidad">${fmtQty(granelData.litros)} Lts.</div>
        </div>
        <div class="segment-card recarga">
          <div class="nombre">Recargas</div>
          <div class="cantidad">${fmtQty(recargaData.litros)} Lts.</div>
          <div class="sub">${recargaData.cantidadRemitos.toLocaleString("es-AR")} recargas</div>
        </div>
      </div>`;
      html += `</div>`;
      html += `<table><thead><tr><th>Producto</th><th>Cantidad</th><th>Total</th><th>Stock</th></tr></thead><tbody>`;
      if(resto.length===0){
        html += `<tr><td colspan="4" style="color:var(--foam-dim);text-align:center;padding:18px;">No hay más productos vendidos este mes.</td></tr>`;
      }
      resto.forEach(f=>{
        const prod = state.productos.find(p=>p.id==f.pid);
        const esLitros = prod && prod.unidadMedida==='litros';
        const cantTxt = esLitros ? fmtQty(f.cantidad) : f.cantidad;
        const stockTxt = esLitros ? fmtQty(prod?prod.stock:0) : (prod?prod.stock:"—");
        html += `<tr><td>${f.nombre}</td><td class="mono">${cantTxt}</td><td class="mono num">${fmtMoney(f.total)}</td><td class="mono num">${stockTxt}</td></tr>`;
      });
      html += `</tbody></table>`;
      html += `</div>`;
    }

    html += `<div class="section-title">Movimientos de barriles</div>`;
    const fuera = state.barriles.filter(b=>barrilEstado(b)!=="planta");
    if(fuera.length===0){ html += `<div class="empty">No hay barriles entregados en este momento.</div>`; }
    else {
      html += `<table><thead><tr><th></th><th>Barril</th><th>Cliente</th><th>Entregado</th><th>Días fuera</th><th>Estado</th></tr></thead><tbody>`;
      fuera.forEach(b=>{
        const est = barrilEstado(b);
        const expanded = ui.expandedBarril===b.id;
        html += `<tr class="clickable" onclick="EuskeraApp.toggleBarrilExpand('${b.id}')">
          <td class="mono" style="width:16px;">${expanded?'▾':'▸'}</td>
          <td class="mono">${b.id}${b.descripcion?' · '+b.descripcion:''}</td>
          <td>${b.clienteNombre||"—"}</td><td>${fmtDate(b.fechaEntrega)}</td><td>${daysSince(b.fechaEntrega)}</td><td>${pillFor(est)}</td>
        </tr>`;
        if(expanded){
          html += `<tr class="expand-row"><td colspan="6">`;
          if(!b.movimientos || b.movimientos.length===0){ html += `<span style="color:var(--foam-dim);">Sin movimientos registrados.</span>`; }
          else {
            html += `<table><thead><tr><th>Fecha</th><th>Acción</th><th>Cliente</th></tr></thead><tbody>`;
            b.movimientos.slice().reverse().forEach(m=>{
              html += `<tr><td class="mono">${fmtDate(m.fecha)}</td><td class="mono">${m.accion}</td><td>${m.clienteNombre||"—"}</td></tr>`;
            });
            html += `</tbody></table>`;
          }
          html += `</td></tr>`;
        }
      });
      html += `</tbody></table>`;
    }
    return html;
  }

  function buildMonthlyBuckets(n){
    const out = []; const now = new Date();
    for(let i=n-1;i>=0;i--){
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
      const label = d.toLocaleDateString('es-AR',{month:'short',year:'2-digit'});
      out.push({key, label});
    }
    return out;
  }

    rows.forEach(r=>{ csv += r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',') + '\n'; });
    const blob = new Blob(["\ufeff"+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);

  function asignarPagosFIFO(remitos, totalPagado){
    const ordenados = [...remitos].sort((a,b)=> a.fecha<b.fecha?-1 : a.fecha>b.fecha?1 : (a.id-b.id));
    let restante = totalPagado;
    return ordenados.map(r=>{
      const total = Number(r.total);
      const cubierto = Math.min(total, Math.max(0, restante));
      restante -= cubierto;
      let estadoPago = 'Pendiente';
      if(cubierto >= total - 0.005) estadoPago = 'Pagado';
      else if(cubierto > 0) estadoPago = 'Parcial';
      return {...r, cubierto, pendiente: total-cubierto, estadoPago};
    });
  }

    const facturado = state.remitos.filter(r=>r.medioPago==='Cuenta Corriente' && String(r.clienteId)===String(clienteId)).reduce((s,r)=>s+Number(r.total),0);
    const pagado = state.ccPagos.filter(p=>String(p.clienteId)===String(clienteId)).reduce((s,p)=>s+Number(p.monto),0);
    return {facturado, pagado, saldo: facturado - pagado};
  }

  function formatArNumberInput(el){
    let raw = el.value;
    const neg = raw.trim().startsWith('-');
    raw = raw.replace(/[^\d,]/g, '');
    const firstComma = raw.indexOf(',');
    if(firstComma !== -1){ raw = raw.slice(0, firstComma+1) + raw.slice(firstComma+1).replace(/,/g,''); }
    let [intPart, decPart] = raw.split(',');
    intPart = (intPart||'').replace(/^0+(?=\d)/,'');
    if(intPart === '') intPart = '0';
    intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    let formatted = intPart;
    if(decPart !== undefined) formatted += ',' + decPart.slice(0,3);
    if(neg) formatted = '-' + formatted;
    el.value = formatted;
  }
  function parseArNumber(str){
    if(str===undefined || str===null || str==='') return 0;
    return parseFloat(String(str).replace(/\./g,'').replace(',', '.')) || 0;
  }

  function renderInformesCharts(){
    if(!window.Chart) return;
    if(window.ChartDataLabels && !Chart._euskeraRegistered){ Chart.register(window.ChartDataLabels); Chart._euskeraRegistered = true; }
    Object.values(charts).forEach(c=>{ if(c) c.destroy(); });
    charts = {};
    const n = ui.informesRango;
    const buckets = buildMonthlyBuckets(n);
    const labels = buckets.map(b=>b.label);
    const ventasPorMes = buckets.map(b=>state.remitos.filter(r=>r.fecha.slice(0,7)===b.key).reduce((s,r)=>s+Number(r.total),0));
    const comprasPorMes = buckets.map(b=>state.compras.filter(c=>c.fecha.slice(0,7)===b.key).reduce((s,c)=>s+Number(c.total),0));
    const granelPorMes = buckets.map(b=>segmentadoMes(b.key,'granel'));
    const recargaPorMes = buckets.map(b=>segmentadoMes(b.key,'recarga'));

    const textColor = '#F3ECDD';
    const gridColor = 'rgba(243,236,221,0.08)';
    const commonScales = { x:{ticks:{color:textColor,font:{size:9}},grid:{display:false}}, y:{display:false,grid:{color:gridColor}} };

    const cv = document.getElementById('chart-ventas');
    if(cv) charts.ventas = new Chart(cv, {type:'bar', data:{labels, datasets:[{label:'Ventas $', data:ventasPorMes, backgroundColor:'#C17D3E'}]},
      options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, datalabels:{display:false}}, scales:commonScales}});

    const cl = document.getElementById('chart-litros');
    if(cl) charts.litros = new Chart(cl, {type:'bar', data:{labels, datasets:[
      {label:'Granel', data:granelPorMes, backgroundColor:'#3F6B4C'},
      {label:'Recarga', data:recargaPorMes, backgroundColor:'#C17D3E'}
    ]}, options:{responsive:true, maintainAspectRatio:false,
      plugins:{legend:{labels:{color:textColor,font:{size:9}},boxWidth:10}, datalabels:{display:false}},
      scales:{x:{stacked:true,ticks:{color:textColor,font:{size:9}},grid:{display:false}}, y:{stacked:true,display:false,grid:{color:gridColor}}}}});

    const ccv = document.getElementById('chart-comprasventas');
    if(ccv) charts.comprasVentas = new Chart(ccv, {type:'bar', data:{labels, datasets:[
      {label:'Ventas', data:ventasPorMes, backgroundColor:'#C17D3E'},
      {label:'Compras', data:comprasPorMes, backgroundColor:'#A8462F'}
    ]}, options:{responsive:true, maintainAspectRatio:false,
      plugins:{legend:{labels:{color:textColor,font:{size:9}},boxWidth:10}, datalabels:{display:false}},
      scales:commonScales}});

    const porVariedad = {};
    buckets.forEach(b=>{
      state.remitos.filter(r=>r.fecha.slice(0,7)===b.key).forEach(r=>{
        (r.items||[]).forEach(it=>{
          const prod = state.productos.find(p=>p.id==it.productoId);
          if(prod && prod.tipo==='granel' && prod.unidadMedida==='litros'){
            porVariedad[prod.nombre] = (porVariedad[prod.nombre]||0) + Number(it.cantidad);
          }
        });
      });
    });
    const cvar = document.getElementById('chart-variedad');
    if(cvar){
      const varLabels = Object.keys(porVariedad);
      const varData = varLabels.map(k=>porVariedad[k]);
      const varTotal = varData.reduce((s,v)=>s+v,0);
      charts.variedad = new Chart(cvar, {type:'doughnut', data:{labels:varLabels, datasets:[{data:varData, backgroundColor:['#C17D3E','#3F6B4C','#A8462F','#E3A968','#7FB88F','#8A7F6E','#E0876F'], borderColor:'#17130F', borderWidth:3}]},
        options:{responsive:true, maintainAspectRatio:false,
          plugins:{legend:{position:'bottom',labels:{color:textColor,font:{size:13}}},
            datalabels:{color:'#17130F', font:{size:20,weight:'800'}, formatter:(v)=> varTotal ? ((v/varTotal)*100).toFixed(0)+'%' : ''}}}});
    }
  }

        <p style="color:var(--foam-100);font-size:14px;margin-bottom:18px;">Se generó el remito <strong>${g.numero}</strong>.</p>
        <a class="btn" href="remito_pdf.php?id=${g.id}" target="_blank" style="text-decoration:none;display:inline-block;">Ver / descargar PDF</a>
        <button class="btn ghost" onclick="EuskeraApp.closeModal()" style="margin-left:8px;">Cerrar</button>`;
    }

    if(m.name==="nuevoRemito"){
      wide = true;
      if(!ui.remitoDraft) ui.remitoDraft = nuevoRemitoDraft();
      const d = ui.remitoDraft;
      const clienteOpts = state.clientes.map(c=>`<option value="${c.id}" ${d.clienteId==c.id?'selected':''}>${c.nombre}</option>`).join("");
      const barrilOpts = state.barriles.filter(b=>b.estado==='planta').map(b=>
        `<label style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--foam-faint);cursor:pointer;">
          <input type="checkbox" class="remito-barril-check" value="${b.id}" ${d.barrilIds.includes(b.id)?'checked':''} style="width:auto;" onchange="EuskeraApp.syncRemitoDraftFromDOM()">
          <span class="mono">${b.id}</span>${b.descripcion?' · '+b.descripcion:''} (${b.litros}L)
        </label>`).join("");
      let total = 0;
      d.items.forEach(it=>{ total += Number(it.cantidad||0)*Number(it.precioUnit||0); });

      inner = `<h2 class="stencil">Nuevo remito</h2>
        <div class="field-row">
          <div class="field"><label>Cliente</label><select id="f-remito-cliente">
            <option value="">Elegí un cliente…</option>${clienteOpts}
          </select></div>
          <div class="field"><label>Fecha</label><input id="f-remito-fecha" type="date" value="${d.fecha}"></div>
        </div>
        <div class="field"><label>Tipo de Venta</label><select id="f-remito-tipoventa" onchange="EuskeraApp.onRemitoTipoVentaChange()">
            <option value="varios" ${d.tipoVenta==='varios'?'selected':''}>Varios</option>
            <option value="recarga" ${d.tipoVenta==='recarga'?'selected':''}>Recarga</option>
            <option value="granel" ${d.tipoVenta==='granel'?'selected':''}>Granel</option>
          </select></div>
        ${d.tipoVenta==='granel' ? `<div class="field"><label>¿Qué barril(es) se lleva?</label>
            <div style="border:1px solid var(--foam-faint);border-radius:6px;padding:0 10px;max-height:180px;overflow-y:auto;">
              ${barrilOpts || '<p style="color:var(--foam-dim);font-size:12px;padding:10px 0;">No hay barriles en planta.</p>'}
            </div>
          </div>` : ''}

        <div class="section-title first" style="margin-top:18px;">Renglones</div>
        <div class="item-row-headers"><span>Producto</span><span>Cantidad</span><span>Precio unit.</span><span>Subtotal</span><span></span></div>
        ${d.items.map((it,idx)=>renderRemitoItemRow(it,idx)).join("")}
        <button class="btn ghost small" onclick="EuskeraApp.addRemitoItem()">+ Agregar renglón</button>
        <div class="remito-total">Total: ${fmtMoney(total)}</div>
        <div class="field"><label>Medio de pago</label><select id="f-remito-mediopago">${mediosPagoOpts(d.medioPago)}</select></div>
        <button class="btn" onclick="EuskeraApp.submitNuevoRemito()">Generar remito</button>
        <button class="btn ghost" onclick="EuskeraApp.closeModal();ui_remitoDraft_reset()" style="margin-left:8px;">Cancelar</button>`;
    }

    return `<div class="modal-backdrop" onclick="if(event.target===this)EuskeraApp.closeModal()"><div class="modal${wide?' wide':''}">${inner}</div></div>`;
  }

  function onInsumoChange(){
    const sel = document.getElementById("f-insumo");
    const unidadField = document.getElementById("f-unidad");
    if(sel.value){ const opt = sel.options[sel.selectedIndex]; unidadField.value = opt.dataset.unidad || ""; }
  }

  function render(){
    const app = document.getElementById("app");
    if(!ui.loaded){ app.innerHTML = `<div style="padding:40px;color:var(--foam-dim);">Cargando panel…</div>`; return; }
    if(!ui.auth){ app.innerHTML = renderLogin(); return; }

    let content = "";
    if(ui.tab==="dashboard") content = renderDashboard();
    else if(ui.tab==="barriles") content = renderBarriles();
    else if(ui.tab==="productos") content = renderProductos();
    else if(ui.tab==="insumos") content = renderInsumos();
    else if(ui.tab==="proveedores") content = renderProveedores();
    else if(ui.tab==="compras") content = renderCompras();
    else if(ui.tab==="clientes") content = renderClientes();
    else if(ui.tab==="ventas") content = renderVentas();
    else if(ui.tab==="cuentascorrientes") content = renderCuentasCorrientes();
    else if(ui.tab==="produccion") content = renderProduccion();
    else if(ui.tab==="recetas") content = renderRecetas();
    else if(ui.tab==="dashventas") content = renderInformes();
    else if(ui.tab==="dashcompras") content = renderDashCompras();
    else if(ui.tab==="ajustes") content = renderAjustes();
    else if(ui.tab==="gastos") content = renderGastos();
    else if(ui.tab==="categoriasgasto") content = renderCategoriasGasto();
    else if(ui.tab==="balancemensual") content = renderBalanceMensual();
    else if(ui.tab==="mediospago") content = renderMediosPago();
    else if(ui.tab==="tiposinsumo") content = renderTiposInsumo();

    app.innerHTML = `<button class="menu-toggle" onclick="EuskeraApp.toggleSidebar()">☰</button>` + renderSidebar() + `<div class="main">${content}</div>` + renderModal();

    if(ui.tab==="dashventas"){
      setTimeout(renderInformesCharts, 0);
    }
    if(ui.tab==="ajustes" && ui.ajustesData===null){
      setTimeout(cargarAjustes, 0);
    }

    if(ui.modal && ui.modal.name==="qr"){
      const target = document.getElementById("qr-render");
      if(target && window.QRCode){
        target.innerHTML = "";
        new QRCode(target, { text:"https://panel.euskera.com.ar/?barril="+ui.modal.payload, width:160, height:160, colorDark:"#17130F", colorLight:"#ffffff" });
      }
    }
  }

  window.EuskeraApp = {
    setTab, openModal, closeModal, intentarLogin, logout, render, toggleBarrilExpand, formatCuitInput, formatDocInput, abrirKardex, toggleSidebar, formatArNumberInput,
    setInformesRango, setInformesQuery, exportCSV,
    confirmarEliminar, ejecutarEliminar, submitEditarRemito, submitPagoCC, eliminarPagoCC,
    submitNuevoBarril, submitEditarBarril, submitEntregarBarril, devolverBarril,
    submitNuevoProducto, submitEditarProducto, ajustarStockProducto,
    submitNuevoCliente, submitEditarCliente, submitNuevoContactoCliente, submitNuevoProveedor, submitEditarProveedor, submitNuevoContactoProveedor,
    submitNuevoInsumo, submitEditarInsumo, submitNuevoTipoInsumo, submitNuevoMedioPago,
    submitNuevaCompra, submitEditarCompra, syncEditCompraDraftFromDOM, addCompraItem, removeCompraItem, onCompraItemTipoChange, syncCompraDraftFromDOM,
    onLoteProductoChange, onLoteLitrosChange, addLoteItem, removeLoteItem, syncLoteDraftFromDOM, submitNuevoLote, pasarAFermentacion, pasarAMaduracion, submitMarcarFermentado,
    addRecetaItem, removeRecetaItem, syncRecetaDraftFromDOM, submitNuevaReceta,
    onAjusteManualTipoChange, addAjusteManualItem, removeAjusteManualItem, syncAjusteManualDraftFromDOM, submitAjusteManual,
    submitNuevoGasto, submitNuevaCategoriaGasto, setBalanceMes,
    addRemitoItem, removeRemitoItem, onRemitoProductoChange, onRemitoSubtotalChange, onRemitoTipoVentaChange, syncRemitoDraftFromDOM, submitNuevoRemito
  };
  window.ui_remitoDraft_reset = function(){ ui.remitoDraft = null; };
  window.ui_compraDraft_reset = function(){ ui.compraDraft = null; };
  window.ui_editCompraDraft_reset = function(){ ui.editCompraDraft = null; };
  window.ui_loteDraft_reset = function(){ ui.loteDraft = null; };
  window.ui_recetaDraft_reset = function(){ ui.recetaDraft = null; };
  window.ui_ajusteManualDraft_reset = function(){ ui.ajusteManualDraft = null; };

  document.addEventListener('keydown', function(e){
    if(e.key==='Escape' && ui.modal){ closeModal(); }
  });

  loadData();
})();
</script>
</body>
</html>
